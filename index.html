<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cairn — one step at a time</title>
    <meta name="description" content="A calm, private to-do app: type what's on your mind, Cairn sorts it and shows you one next step. Free, no sign-up." />
    <meta name="theme-color" content="#f3f1f8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Cairn — one step at a time" />
    <meta property="og:description" content="Type what's on your mind. Cairn sorts it and shows you one next step." />
    <meta property="og:type" content="website" />
    <script>
      // Set the theme before first paint to avoid a light flash in dark mode.
      try {
        if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
