<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nearer — your to-dos on a radar</title>
    <meta name="description" content="A free, private to-do app that shows everything you're carrying on one radar: today in the middle, someday at the edge. No sign-up." />
    <meta name="theme-color" content="#e8ece6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Nearer — your to-dos on a radar" />
    <meta property="og:description" content="Today in the middle, someday at the edge. Free, private, no sign-up." />
    <meta property="og:type" content="website" />
    <script>
      // Set the theme before first paint to avoid a light flash in dark mode.
      try {
        if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
